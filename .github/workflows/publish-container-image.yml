name: Publish Container Image

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-container-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          path: source
          persist-credentials: false

      - name: Plan image publication
        id: plan
        run: node .github/scripts/release.cjs
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        if: steps.plan.outputs.exists == 'false'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.plan.outputs.image }}
          flavor: latest=false
          tags: type=raw,value=${{ steps.plan.outputs.version }}

      - name: Build and push versioned image
        if: steps.plan.outputs.exists == 'false'
        uses: docker/build-push-action@v5
        with:
          context: source
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Update eligible shared tags
        env:
          IMAGE: ${{ steps.plan.outputs.image }}
          VERSION: ${{ steps.plan.outputs.version }}
          ALIASES: ${{ steps.plan.outputs.aliases }}
        run: |
          mapfile -t aliases < <(jq -r '.[]' <<< "$ALIASES")
          if ((${#aliases[@]})); then
            args=()
            for alias in "${aliases[@]}"; do
              args+=(--tag "$IMAGE:$alias")
            done
            docker buildx imagetools create "${args[@]}" "$IMAGE:$VERSION"
          fi
